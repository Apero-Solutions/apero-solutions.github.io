<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">ModbridgePro product render</title>
  <desc id="desc">Illustrated ModbridgePro gateway device with labels and ports.</desc>
  <defs>
    <linearGradient id="bodyGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#f4f5f2"/>
      <stop offset="100%" stop-color="#dfe4e1"/>
    </linearGradient>
    <linearGradient id="frontGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f9f9f7"/>
      <stop offset="100%" stop-color="#d7dcd9"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#6cd798"/>
      <stop offset="100%" stop-color="#42b76d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="18" flood-color="#0b1f2a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1200" height="820" fill="#f3f3f1"/>

  <g filter="url(#shadow)" transform="translate(170 110)">
    <g transform="rotate(-8 420 280)">
      <path d="M150 90 L790 90 Q860 90 860 160 L860 520 Q860 590 790 590 L150 590 Q80 590 80 520 L80 160 Q80 90 150 90 Z" fill="url(#bodyGrad)"/>
      <path d="M180 140 L760 140 Q800 140 800 180 L800 490 Q800 530 760 530 L180 530 Q140 530 140 490 L140 180 Q140 140 180 140 Z" fill="url(#frontGrad)" stroke="#b2bdb8" stroke-width="2"/>

      <g transform="translate(205 170)">
        <text x="0" y="0" font-size="26" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#1b2d39" letter-spacing="6">APERO SOLUTIONS</text>
        <text x="0" y="42" font-size="52" font-family="Arial, Helvetica, sans-serif" font-weight="800" fill="#0b1f2a">ModbridgePro</text>
        <rect x="0" y="74" width="180" height="2" fill="#7ea7a5" opacity="0.65"/>
        <text x="0" y="120" font-size="20" font-family="Consolas, monospace" fill="#324d58">IOT GATEWAY</text>
        <text x="0" y="155" font-size="20" font-family="Consolas, monospace" fill="#324d58">Modbus RTU / TCP</text>
        <text x="0" y="190" font-size="20" font-family="Consolas, monospace" fill="#324d58">Google Sheets / MQTT</text>
      </g>

      <g transform="translate(540 170)">
        <rect x="0" y="0" width="170" height="120" rx="10" fill="#f0f4f3" stroke="#aab9b5"/>
        <text x="18" y="34" font-size="18" font-family="Consolas, monospace" fill="#3f5b66">B15</text>
        <text x="18" y="74" font-size="44" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#0b1f2a">CC884</text>
        <text x="18" y="98" font-size="14" font-family="Consolas, monospace" fill="#536d75">ESP32-S3</text>
      </g>

      <g transform="translate(140 405)">
        <path d="M0 0 H260" stroke="#b9c7c1" stroke-width="8" stroke-linecap="round"/>
        <path d="M260 0 L260 26" stroke="#b9c7c1" stroke-width="8" stroke-linecap="round"/>
        <path d="M260 26 H320" stroke="#b9c7c1" stroke-width="8" stroke-linecap="round"/>
      </g>

      <g transform="translate(448 500)">
        <path d="M0 0 L320 0" stroke="#b9c7c1" stroke-width="8" stroke-linecap="round"/>
      </g>

      <g transform="translate(705 515)">
        <rect x="0" y="0" width="88" height="50" rx="9" fill="#e7edea" stroke="#9aaea6"/>
        <path d="M20 12 L60 12 M20 25 L60 25 M20 38 L60 38" stroke="#60757d" stroke-width="3" stroke-linecap="round"/>
      </g>

      <g transform="translate(190 528)">
        <path d="M0 0 L0 90" stroke="#1a232a" stroke-width="8"/>
        <path d="M0 90 L0 145" stroke="#0c1117" stroke-width="18"/>
        <path d="M0 145 L80 145" stroke="#0c1117" stroke-width="18"/>
      </g>

