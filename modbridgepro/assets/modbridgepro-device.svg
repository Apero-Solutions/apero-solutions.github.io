        <rect x="18" y="16" width="144" height="82" rx="8" fill="#f9f9f8" stroke="#d4d9d6"/>
        <text x="38" y="54" font-size="18" font-family="Consolas, monospace" fill="#39b270">230.4</text>
        <text x="118" y="54" font-size="12" font-family="Consolas, monospace" fill="#7a8c95">V</text>
        <path d="M32 90 H150" stroke="#b8c7c3" stroke-width="2"/>
        <text x="30" y="120" font-size="12" font-family="Consolas, monospace" fill="#607780">RS-485</text>
      </g>

      <g transform="translate(500 320)">
        <rect x="0" y="0" width="210" height="98" rx="18" fill="#0d1a22"/>
        <circle cx="180" cy="20" r="8" fill="#f3c15c"/>
        <text x="18" y="32" font-size="16" font-family="Consolas, monospace" fill="#8aa4ad">GATEWAY</text>
        <text x="18" y="62" font-size="44" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#eaf2f1">B15</text>
      </g>

      <g transform="translate(520 438)">
        <rect x="0" y="0" width="170" height="34" rx="10" fill="#e5efe9"/>
        <circle cx="20" cy="17" r="6" fill="#48c277"/>
        <circle cx="42" cy="17" r="6" fill="#c8d7d1"/>
        <circle cx="64" cy="17" r="6" fill="#c8d7d1"/>
      </g>

      <g transform="translate(140 610)">
        <rect x="0" y="0" width="660" height="98" rx="14" fill="#fbfcfb" stroke="#d2d9d5"/>
        <g transform="translate(18 18)">
