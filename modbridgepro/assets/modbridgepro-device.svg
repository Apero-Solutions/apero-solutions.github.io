          <text x="18" y="32" font-size="16" font-family="Consolas, monospace" fill="#3e4d57">Modbus</text>
        </g>
        <g transform="translate(178 18)">
          <rect x="0" y="0" width="180" height="52" rx="8" fill="#f0f4f3"/>
          <text x="18" y="32" font-size="16" font-family="Consolas, monospace" fill="#3e4d57">Google Sheets</text>
        </g>
        <g transform="translate(380 18)">
          <rect x="0" y="0" width="140" height="52" rx="8" fill="#f0f4f3"/>
          <text x="18" y="32" font-size="16" font-family="Consolas, monospace" fill="#3e4d57">MQTT</text>
        </g>
